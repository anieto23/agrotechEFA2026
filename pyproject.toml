[project]
name = "agrotechefa2026"
version = "0.1.0"
description = "Monitorización de sensores de parcelas agrícolas (II Reto Agrotech 2026)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "anieto23", email = "anieto23@efaelsoto.com" }
]
requires-python = ">=3.11"
dependencies = [
    "reflex[db]>=0.10.0",
    "fastapi>=0.115",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
agrotechefa2026 = "agrotechefa2026:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
